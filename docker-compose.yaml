services:
  spacetime:
    image: clockworklabs/spacetime:latest
    ports:
      - "3000:3000"
    volumes:
      - spacetimedata:/spacetime
    command: start --db-path /spacetime

  orchestrator:
    build:
      context: .
      dockerfile: packages/orchestrator/Dockerfile
    ports:
      - "50051:50051"
    depends_on:
      - spacetime
    environment:
      - SPACETIME_HOST=http://spacetime:3000
      - GRPC_PORT=50051

  runtime:
    build:
      context: .
      dockerfile: packages/runtime/Dockerfile
    depends_on:
      - spacetime
      - orchestrator
    environment:
      - SPACETIME_HOST=http://spacetime:3000
      - ORCHESTRATOR_ADDR=orchestrator:50051
      # Amazon Bedrock (default LLM). Do not put access keys in this file.
      # The runtime uses the standard AWS credential chain (env, shared
      # config, or the task role). Region defaults to us-east-1.
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Only required when an agent model id is an explicit OpenAI model.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

volumes:
  spacetimedata: