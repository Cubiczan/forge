[package]
name = "forge-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Forge container orchestrator — manages container lifecycle via gRPC"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
tonic-build = "0.12"